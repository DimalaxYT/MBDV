[project]
name = "mbdv-prospection"
version = "1.0.0"
description = "Outil interne de prospection : entreprises francaises sans site web"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "RET", "BLE", "SIM", "S", "DTZ"]
ignore = [
  "S101",   # assert : normal dans les tests
  "DTZ007", # strptime() sans fuseau : nos horodatages sont stockes en UTC ("...Z")
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]   # mots de passe de test en clair

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
